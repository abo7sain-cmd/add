<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة المدرسة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b3b32;--panel:#10493e;--ink:#f6f4ec;--gold:#d4a94a;--mute:#a9c4bb}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;cursor:none}
.screen{height:100vh;display:grid;grid-template-rows:15vh 1fr 14vh;gap:1.6vh;padding:2vh 2vw}
header{display:flex;align-items:center;gap:2vw;border-bottom:.35vh solid var(--gold);padding-bottom:1.2vh}
#logo{height:11vh;display:none}
#school{font-size:5.2vh;font-weight:800;flex:1}
.clock{text-align:left;direction:ltr;font-size:7.5vh;font-weight:800;line-height:1}
.dates{font-size:2.6vh;color:var(--mute);margin-top:.6vh;direction:rtl;text-align:left}
.wx{font-size:3.4vh;font-weight:700;padding:0 1.5vw;border-inline-start:.2vh solid var(--mute);min-width:12vw;text-align:center}
main{display:grid;grid-template-columns:1.5fr 1fr;gap:2vw;min-height:0}
section{background:var(--panel);border-radius:1.2vh;padding:3vh 2.4vw;display:flex;flex-direction:column;min-height:0}
h2{font-size:3.6vh;color:var(--gold);margin-bottom:2vh}
#ann{flex:1;display:flex;align-items:center;gap:2.4vw;min-height:0;transition:opacity .6s}
#ann .t{font-size:5.2vh;line-height:1.55;font-weight:700;flex:1}
#ann img{max-width:42%;max-height:100%;object-fit:contain;border-radius:1.2vh}
.honor{display:flex;align-items:center;gap:1.4vw;font-size:3.9vh;font-weight:700;padding:1vh 0;border-bottom:.15vh solid #ffffff22}
.honor .n{flex:1}.honor small{display:block;font-size:2.6vh;color:var(--mute);font-weight:400}
.av{width:6.6vh;height:6.6vh;border-radius:50%;object-fit:cover;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:3.6vh;flex:none}
#honor{transition:opacity .6s}
footer{display:flex;align-items:center;overflow:hidden;direction:ltr;border-top:.2vh solid #ffffff33}
.track{display:inline-flex;white-space:nowrap;animation:mv var(--d,40s) linear infinite;will-change:transform}
.h{display:inline-flex;align-items:center}
.it{direction:rtl;unicode-bidi:isolate;padding:0 2.5vw;font-size:4vh;font-weight:700}
.it span{color:var(--gold);font-size:2.8vh;font-weight:400;margin-inline-start:1vw}
.sep{color:var(--gold);padding:0}
@keyframes mv{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.fade{opacity:0}
</style></head><body>
<div class="screen">
 <header><img id="logo" alt=""><div id="school">اسم المدرسة</div>
  <div class="wx" id="wx"></div>
  <div><div class="clock" id="clock"></div><div class="dates" id="dates"></div></div></header>
 <main>
  <section><h2>الإعلانات</h2><div id="ann"></div></section>
  <section><h2>لوحة الشرف</h2><div id="honor"></div></section>
 </main>
 <footer id="foot"></footer>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig,WEATHER} from "./firebase-config.js";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={announcements:[],honor:[],quotes:[],seconds:12};
const IMG={};
// الساعة والتاريخ
const hj=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const gr=new Intl.DateTimeFormat('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'});
function tick(){const n=new Date();
 $('clock').textContent=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
 $('dates').innerHTML=hj.format(n)+'<br>'+gr.format(n);}
tick();setInterval(tick,10000);
// الطقس
async function weather(){try{
 const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${WEATHER.lat}&longitude=${WEATHER.lon}&current=temperature_2m,weather_code`);
 const c=(await r.json()).current,k=c.weather_code;
 const t=k===0?'صافٍ':k<4?'غائم جزئيًا':k<50?'ضباب':k<70?'مطر':k<80?'ثلج':'عواصف';
 $('wx').innerHTML=Math.round(c.temperature_2m)+'°<br><small style="font-size:2.4vh;font-weight:400">'+t+'</small>';
}catch(e){}}
weather();setInterval(weather,900000);
// دوران العناصر
let ai=0,hi=0,timer;
function rotate(){
 const a=D.announcements||[];$('ann').classList.add('fade');
 setTimeout(()=>{const x=a.length?a[ai++%a.length]:{text:'لا توجد إعلانات حاليًا'};
  $('ann').innerHTML=`<div class="t">${esc(x.text)}</div>`+(x.img&&IMG[x.img]?`<img src="${IMG[x.img]}" alt="">`:'');
  $('ann').classList.remove('fade')},600);
 const h=D.honor||[],per=5,pages=Math.max(1,Math.ceil(h.length/per));
 $('honor').classList.add('fade');
 setTimeout(()=>{const s=(hi++%pages)*per;
  $('honor').innerHTML=h.slice(s,s+per).map(x=>`<div class="honor">${x.img&&IMG[x.img]?`<img class="av" src="${IMG[x.img]}" alt="">`:`<div class="av">${esc((x.name||'').trim().charAt(0))}</div>`}<div class="n">${esc(x.name)}${x.note?`<small>${esc(x.note)}</small>`:''}</div></div>`).join('')||'<div class="honor"><div class="n"><small>لا توجد أسماء حاليًا</small></div></div>';
  $('honor').classList.remove('fade')},600);
 }
// شريط الآية/الحديث المتحرك (من اليسار لليمين)
async function ticker(){const f=$('foot'),q=D.quotes||[];
 if(!q.length){f.innerHTML='';return}
 const one=q.map(x=>`<div class="it">${esc(x.text)}${x.source?`<span>${esc(x.source)}</span>`:''}</div><div class="it sep">✦</div>`).join('');
 f.innerHTML=`<div class="track" id="trk"><div class="h">${one}</div></div>`;
 try{await document.fonts.ready}catch(e){}
 const w=f.querySelector('.h').offsetWidth||1,n=Math.max(1,Math.ceil(f.clientWidth/w)),half=one.repeat(n);
 f.innerHTML=`<div class="track" id="trk"><div class="h">${half}</div><div class="h">${half}</div></div>`;
 const hw=f.querySelector('.h').offsetWidth;
 $('trk').style.setProperty('--d',(hw/(f.clientWidth/22))+'s');}
function start(){clearInterval(timer);rotate();timer=setInterval(rotate,(D.seconds||12)*1000)}
// البيانات من Firebase
const db=getFirestore(initializeApp(firebaseConfig));
async function loadImgs(){
 const ids=[D.logoId,...(D.announcements||[]).map(x=>x.img),...(D.honor||[]).map(x=>x.img)].filter(i=>i&&!IMG[i]);
 await Promise.all(ids.map(async i=>{try{const s=await getDoc(doc(db,'portal_tv',i));if(s.exists())IMG[i]=s.data().data}catch(e){}}));}
onSnapshot(doc(db,'portal_tv','school_screen'),async s=>{if(!s.exists())return;D={...D,...s.data()};
 $('school').textContent=D.schoolName||'اسم المدرسة';
 await loadImgs();
 if(D.logoId&&IMG[D.logoId]){$('logo').src=IMG[D.logoId];$('logo').style.display='block'}else $('logo').style.display='none';
 ai=hi=0;start();ticker();});
start();
</script></body></html>
