<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حضور وغياب الطلاب</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--ink:#16283c;--bg:#eef1f4;--line:#d5dbe2;--br:#1c4e80;--p:#d9f2e2;--pb:#4fb27a;--pt:#14532d;--a:#d92d3a;--e:#f08a24;--l:#7b8794}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif}
header{background:var(--ink);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
header h1{margin:0 0 8px;font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;align-items:center}
nav a{color:#cfd8e3;text-decoration:none;padding:6px 14px;border-radius:99px;white-space:nowrap;font-size:13px;font-weight:600}
nav a.on{background:#fff;color:var(--ink)}nav i{width:1px;height:18px;background:#3d5068;margin:0 4px}
main{padding:14px;max-width:1200px;margin:auto}
button,select,input,textarea{font:inherit}
.btn{border:0;border-radius:9px;padding:8px 15px;font-weight:700;cursor:pointer;background:var(--br);color:#fff}
.btn.g{background:#e3e8ee;color:var(--ink)}.btn.r{background:var(--a)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;max-width:100%}
textarea{width:100%;line-height:1.8}label{font-size:12px;color:#5a6877;display:block;margin-bottom:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}h2{margin:0 0 10px;font-size:17px}
.att{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start}.side{position:sticky;top:100px}
.side button{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.side button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.col{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.col h3{margin:0;padding:9px 12px;background:#f3f5f8;font-size:14px;display:flex;justify-content:space-between;gap:6px}.col h3 small{font-weight:400;color:#5a6877}
.t{display:flex;gap:8px;width:100%;text-align:right;border:0;border-bottom:1px solid #fff;padding:9px 10px;font-weight:600;cursor:pointer;background:var(--p);color:var(--pt)}
.t i{font-style:normal;opacity:.6;min-width:20px;font-size:12px}
.t.a{background:var(--a);color:#fff}.t.e{background:var(--e);color:#2a1700}.t.l{background:var(--l);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}.stat b{display:block;font-size:28px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}th{background:#f3f5f8}td:nth-child(2){text-align:right}
.bd{padding:2px 10px;border-radius:99px;color:#fff;font-size:12px}.bd.a{background:var(--a)}.bd.e{background:var(--e)}.bd.l{background:var(--l)}
.toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:99px;z-index:50}
.hint{font-size:12px;color:#5a6877}
@media(max-width:800px){.att{grid-template-columns:1fr}.side{position:sticky;top:92px;z-index:10;padding:8px}.side b{display:none}.side .md{display:flex;gap:6px}.side button{margin-top:0;font-size:12px;padding:8px 4px;justify-content:center}}
@media print{header,.no-print{display:none}body{background:#fff}.card{border:0}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:8px}.tiles.bg{grid-template-columns:repeat(auto-fill,minmax(125px,1fr))}
.tl{aspect-ratio:1;border:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:6px;font-weight:600;font-size:13px;line-height:1.3;cursor:pointer;background:var(--p);color:var(--pt);overflow:hidden;word-break:break-word;touch-action:manipulation}
.tl i{font-style:normal;font-size:11px;opacity:.65}.tl small{font-weight:400;font-size:11px;opacity:.9}
.tl.a{background:var(--a);color:#fff}.tl.e{background:var(--e);color:#2a1700}.tl.l{background:var(--l);color:#fff}.tl.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tl.s{outline:3px solid #111;outline-offset:-3px}.mini{border:0;border-radius:8px;padding:3px 8px;font-size:11px;background:rgba(255,255,255,.92);color:var(--ink);cursor:pointer}.card{overflow-x:auto}
</style>
</head>
<body>
<header><h1 id="ttl">حضور وغياب الطلاب</h1><nav id="nav"></nav></header>
<main id="main"></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const K='cls_att_v1',pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
/* ===== ضع هنا إعدادات Firebase ورقم جوال المدير ===== */
const CFG={apiKey:'PASTE',authDomain:'add.firebaseapp.com',projectId:'add',appId:'PASTE'},ADMIN='0547808776',B='https://www.gstatic.com/firebasejs/10.12.2/',RL={admin:'مدير',entry:'إدخال',view:'اطلاع'};
let D={school:'',students:[],att:{},tpl:{}},ME=null,F,db,au,U={},BY={},STF=null,M={c:'',s:new Set()},LM='',subD='';
const np=p=>{let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('966'))d=d.slice(3);if(d.length===9&&d[0]==='5')d='0'+d;return d},vis=()=>D.students.filter(s=>!ME||!ME.scope||s.grade===ME.scope);
const T0={abs:'المكرم ولي أمر الطالب: {student}\nالصف: {class}\nنفيدكم بغياب ابنكم عن المدرسة {day} الموافق {date}.\nنأمل تزويد المدرسة بالعذر المقبول.\n{school}',late:'المكرم ولي أمر الطالب: {student}\nالصف: {class}\nنفيدكم بتأخر ابنكم عن بداية الدوام {day} الموافق {date}.\nنأمل التأكيد على الحضور المبكر.\n{school}'};
const save=()=>{if(ME&&ME.role==='admin')F.setDoc(F.doc(db,'school','main'),{school:D.school,students:D.students,tpl:D.tpl}).catch(()=>toast('تعذر الحفظ'))},tpl=k=>D.tpl[k]||T0[k];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('cls|'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
let S={date:iso(new Date()),mode:'a',g:'',c:'',sel:new Set(),sent:new Set()},I={m:'w',d:iso(new Date()),mo:iso(new Date()).slice(0,7),c:''},X=null;
const ST={a:'غائب بدون عذر',e:'غائب بعذر',l:'متأخر'},COL={a:'var(--a)',e:'var(--e)',l:'var(--l)'};
const grades=()=>[...new Set(D.students.map(s=>s.grade))].filter(g=>!ME||!ME.scope||g===ME.scope),lbl=s=>s.cls===s.grade?s.grade:s.grade+' / '+s.cls;
const dayName=d=>new Date(d+'T12:00').toLocaleDateString('ar-SA',{weekday:'long'});
const hijri=d=>{try{const p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'}).formatToParts(new Date(d+'T12:00')),g=t=>p.find(x=>x.type===t).value;return g('day')+'/'+g('month')+'/'+g('year')+'هـ'}catch(e){return d}};
const ph=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('05'))d='966'+d.slice(1);else if(d.length===9&&d[0]==='5')d='966'+d;return d};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const okE=()=>localStorage.getItem('ok_e')===D.pinE||okA(),okA=()=>sessionStorage.getItem('ok_a')===D.pinA;

function loginUI(){$('nav').innerHTML='';$('main').innerHTML=`<div class="card" style="max-width:360px;margin:40px auto;text-align:center"><h2>🔒 تسجيل الدخول</h2><p class="hint">اكتب رقم جوالك المسجّل (يبدأ بـ 05). يبقى الدخول محفوظاً على هذا الجهاز.</p><input id="lp" type="tel" inputmode="numeric" maxlength="10" placeholder="05xxxxxxxx" style="text-align:center;font-size:22px;width:100%" onkeydown="if(event.key==='Enter')login()"><p id="pm" style="color:var(--a);min-height:22px">${LM}</p><button class="btn" onclick="login()">دخول</button></div>`;LM=''}
async function login(){const p=np($('lp').value);if(!/^05\d{8}$/.test(p))return $('pm').textContent='اكتب رقماً صحيحاً يبدأ بـ 05 (10 أرقام)';$('pm').textContent='جارٍ الدخول…';const e=p+'@attendance.app';
 try{await F.signInWithEmailAndPassword(au,e,p)}catch(x){try{await F.createUserWithEmailAndPassword(au,e,p)}catch(y){$('pm').textContent=y.code==='auth/email-already-in-use'?'الرقم غير صحيح':'تعذر الدخول: '+y.code}}}
const out=()=>F.signOut(au);
async function start(){if(CFG.apiKey==='PASTE'){$('main').innerHTML='<div class="card">ألصق إعدادات Firebase (CFG) ورقم المدير (ADMIN) في أعلى السكربت أولاً.</div>';return}
 const [a,u,f]=await Promise.all(['app','auth','firestore'].map(n=>import(B+'firebase-'+n+'.js')));F={...u,...f};const app=a.initializeApp(CFG);au=F.getAuth(app);db=F.getFirestore(app);
 F.onAuthStateChanged(au,x=>{Object.values(U).forEach(f=>f&&f());U={};subD='';ME=null;x?enter(x):loginUI()})}
async function enter(x){const p=x.email.split('@')[0],R=F.doc(db,'staff',p);let s=await F.getDoc(R).catch(()=>null);
 if((!s||!s.exists())&&p===ADMIN){await F.setDoc(R,{name:'المدير',phone:p,role:'admin',scope:''});s=await F.getDoc(R)}
 if(!s||!s.exists()){LM='رقمك غير مسجل لدى الإدارة';return F.signOut(au)}
 ME={phone:p,...s.data()};U.s=F.onSnapshot(F.doc(db,'school','main'),q=>{const d=q.data()||{};D.school=d.school||'';D.students=d.students||[];D.tpl=d.tpl||{};refresh()});render()}
function subAtt(){subD=S.date;U.a&&U.a();const d=S.date;U.a=F.onSnapshot(F.doc(db,'att',d),q=>{const o=q.data()||{};D.att[d]=o.m||{};BY[d]=o.by||{};if(d===S.date)refresh()})}
function refresh(){if(!ME)return;const r=location.hash.slice(1);if(r==='set'&&$('sch'))return;if(r.startsWith('g:')&&$('cols'))$('cols').innerHTML=cols(S.g);else render()}
function render(){if(!ME)return;$('ttl').textContent=D.school||'حضور وغياب الطلاب';if(subD!==S.date)subAtt();
 const adm=ME.role==='admin',vw=adm||ME.role==='view',en=adm||ME.role==='entry',gs=grades(),ok=x=>x.startsWith('g:')?en:x==='set'?adm:vw;
 let r=decodeURIComponent(location.hash.slice(1));if(!r||!ok(r))r=en&&gs.length?'g:'+gs[0]:vw?'stats':adm?'set':'';
 if(r!=='inv')I.k='';nav(r);
 $('main').innerHTML=!r?'<div class="card">لا توجد بيانات بعد.</div>':r.startsWith('g:')?pGrade(r.slice(2)):r==='stats'?pStats():r==='inv'?pInv():pSet();
 if(r==='inv')loadInv();if(r==='set'){if(!STF)loadStaff();if(X)drawX()}}
function nav(r){if(!ME)return;const adm=ME.role==='admin',vw=adm||ME.role==='view',en=adm||ME.role==='entry';
 const g=en?grades().map(x=>`<a href="#${encodeURIComponent('g:'+x)}" class="${r==='g:'+x?'on':''}">${esc(x)}</a>`).join(''):'';
 const o=[...(vw?[['stats','الإحصائية'],['inv','الجرد']]:[]),...(adm?[['set','الإعدادات']]:[])].map(([k,v])=>`<a href="#${k}" class="${r===k?'on':''}">${v}</a>`).join('');
 $('nav').innerHTML=g+(g&&o?'<i></i>':'')+o+'<i></i><a href="#" onclick="out();return false">خروج</a>'}
window.onhashchange=render;
async function loadInv(){const w=I.m==='w',ds=w?idates():null,a=w?ds[0]:I.mo+'-01',b=w?ds[4]:I.mo+'-31',k=a+b;if(I.k===k)return;I.k=k;
 const q=await F.getDocs(F.query(F.collection(db,'att'),F.where(F.documentId(),'>=',a),F.where(F.documentId(),'<=',b)));q.forEach(x=>{if(x.id!==subD)D.att[x.id]=x.data().m||{}});if(location.hash==='#inv')render()}
async function loadStaff(){const q=await F.getDocs(F.collection(db,'staff'));STF=q.docs.map(d=>d.data());if($('stf'))$('stf').innerHTML=stf()}
const stf=()=>STF?STF.map(s=>`<div class="tl w"><b>${esc(s.name)}</b><small dir="ltr">${esc(s.phone)}</small><small>${RL[s.role]||''}${s.scope?' · '+esc(s.scope):''}</small><button class="mini" data-p="${esc(s.phone)}" onclick="delStaff(this.dataset.p)">حذف</button></div>`).join('')||'لا يوجد مستخدمون':'جارٍ التحميل…';
async function delStaff(p){if(p===ADMIN)return toast('لا يمكن حذف المدير');if(!confirm('حذف هذا المستخدم؟'))return;await F.deleteDoc(F.doc(db,'staff',p));loadStaff()}

/* ---------- صفحة الصف: مربعات ---------- */
function pGrade(g){if(S.g!==g)S.c='';S.g=g;const cl=[...new Set(D.students.filter(s=>s.grade===g).map(s=>s.cls))];
return `<div class="card row no-print"><div><label>التاريخ</label><input type="date" value="${S.date}" onchange="S.date=this.value;render()"></div><span>${esc(dayName(S.date))} ${hijri(S.date)}</span>${cl.length>1?`<div><label>الفصل</label><select onchange="S.c=this.value;$('cols').innerHTML=cols(S.g)"><option value="">كل الفصول</option>${cl.map(c=>`<option ${S.c===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`:''}</div>
<div class="att"><div class="side card no-print"><b>اختر الحالة ثم اضغط على الاسم</b><div id="md" class="md">${modes()}</div></div><div id="cols">${cols(g)}</div></div>`}
function modes(){return Object.keys(ST).map(k=>`<button class="${S.mode===k?'on':''}" onclick="S.mode='${k}';$('md').innerHTML=modes()"><i class="dot" style="background:${COL[k]}"></i>${ST[k]}</button>`).join('')}
function cols(g){const day=D.att[S.date]||{},ss=D.students.filter(s=>s.grade===g&&(!S.c||s.cls===S.c));
 return [...new Set(ss.map(s=>s.cls))].map(c=>{const L=ss.filter(s=>s.cls===c),n=L.filter(s=>day[s.id]).length;
 return `<div class="col" style="margin-bottom:10px"><h3>${esc(c)}<small>${L.length} طالب${n?' · '+n+' ملاحظة':''}</small></h3><div class="tiles">${L.map(s=>`<button class="tl ${day[s.id]||''}" data-id="${esc(s.id)}" onclick="mark(this.dataset.id)"><i>${esc(s.num)}</i>${esc(s.name)}</button>`).join('')}</div></div>`}).join('')||'<div class="card">لا يوجد طلاب</div>'}
function mark(id){const d=D.att[S.date]=D.att[S.date]||{},b=BY[S.date]=BY[S.date]||{},same=d[id]===S.mode;
 if(same){delete d[id];delete b[id]}else{d[id]=S.mode;b[id]=ME.name}
 F.setDoc(F.doc(db,'att',S.date),{m:{[id]:same?F.deleteField():S.mode},by:{[id]:same?F.deleteField():ME.name}},{merge:true}).catch(()=>toast('تعذر الحفظ — تحقق من الاتصال'));
 $('cols').innerHTML=cols(S.g)}

/* ---------- الإحصائية والإرسال ---------- */
function msg(s,st){const v={student:s.name,grade:s.grade,class:s.cls,date:hijri(S.date),day:dayName(S.date),school:D.school};return tpl(st==='l'?'late':'abs').replace(/\{(\w+)\}/g,(m,k)=>v[k]??m)}
const lst=()=>{const d=D.att[S.date]||{};return vis().filter(s=>d[s.id])};
function pStats(){const day=D.att[S.date]||{},by=BY[S.date]||{},V=vis(),L=lst(),n=t=>L.filter(s=>day[s.id]===t).length,c=(v,l,col)=>`<div class="stat" style="border-top:4px solid ${col}"><b>${v}</b>${l}</div>`;
return `<div class="card row no-print"><div><label>التاريخ</label><input type="date" value="${S.date}" onchange="S.date=this.value;S.sel=new Set();render()"></div><span>${esc(dayName(S.date))} ${hijri(S.date)}</span><span class="hint">● تحديث مباشر</span></div>
<div class="stats">${c(V.length-L.length,'حاضرون','var(--pb)')}${c(n('a'),'غياب بدون عذر','var(--a)')}${c(n('e'),'غياب بعذر','var(--e)')}${c(n('l'),'متأخرون','var(--l)')}</div>
<div class="card"><div class="row no-print" style="margin-bottom:8px"><button class="btn g" onclick="selAll(1)">تحديد الكل</button><button class="btn g" onclick="selAll(0)">إلغاء</button><span style="flex:1"></span><button class="btn" onclick="sendQ(1)">واتساب للمحددين (${L.filter(s=>S.sel.has(s.id)).length})</button><button class="btn" onclick="sendQ(0)">واتساب للجميع (${L.length})</button></div>
${L.length?`<div class="tiles bg">${L.map(s=>{const sd=S.sent.has(S.date+'|'+s.id);return `<div class="tl ${day[s.id]} ${S.sel.has(s.id)?'s':''}" data-id="${esc(s.id)}" onclick="tog(this.dataset.id)"><b>${esc(s.name)}</b><small>${esc(lbl(s))}</small><small>${ST[day[s.id]]}${by[s.id]?' · '+esc(by[s.id]):''}</small>${ph(s.phone)?`<button class="mini" data-id="${esc(s.id)}" onclick="event.stopPropagation();sendOne(this.dataset.id)">${sd?'تم ✓':'واتساب'}</button>`:''}</div>`}).join('')}</div>`:'<p>لا يوجد غياب أو تأخر في هذا اليوم 🎉</p>'}</div>`}
const tog=id=>{S.sel.has(id)?S.sel.delete(id):S.sel.add(id);render()},selAll=on=>{S.sel=on?new Set(lst().map(s=>s.id)):new Set();render()};
function sendOne(id){const s=D.students.find(x=>x.id===id),st=(D.att[S.date]||{})[id];if(!s||!st)return;window.open('https://wa.me/'+ph(s.phone)+'?text='+encodeURIComponent(msg(s,st)),'_blank');S.sent.add(S.date+'|'+id);render()}
function sendQ(only){const n=lst().find(s=>(!only||S.sel.has(s.id))&&ph(s.phone)&&!S.sent.has(S.date+'|'+s.id));n?sendOne(n.id):toast('تم الإرسال للجميع أو لا توجد أرقام')}

/* ---------- الجرد الأسبوعي / الشهري ---------- */
function idates(){if(I.m==='w'){const d=new Date(I.d+'T12:00');d.setDate(d.getDate()-d.getDay());return[0,1,2,3,4].map(i=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}return Object.keys(D.att).filter(k=>k.startsWith(I.mo)).sort()}
function pInv(){const ds=idates(),keys=[...new Set(D.students.map(s=>s.grade+'|'+s.cls))],w=I.m==='w';
const rows=vis().filter(s=>!I.c||s.grade+'|'+s.cls===I.c).map(s=>{const r={s,a:0,e:0,l:0,c:ds.map(d=>(D.att[d]||{})[s.id]||'')};r.c.forEach(x=>{if(x)r[x]++});return r}).filter(r=>r.a+r.e+r.l),T=k=>rows.reduce((x,r)=>x+r[k],0);
return `<div class="card row no-print"><div><label>الفترة</label><select onchange="I.m=this.value;render()"><option value="w" ${w?'selected':''}>أسبوعي</option><option value="m" ${w?'':'selected'}>شهري</option></select></div>
<div><label>${w?'أي يوم من الأسبوع':'الشهر'}</label>${w?`<input type="date" value="${I.d}" onchange="I.d=this.value;render()">`:`<input type="month" value="${I.mo}" onchange="I.mo=this.value;render()">`}</div>
<div><label>الفصل</label><select onchange="I.c=this.value;render()"><option value="">الكل</option>${keys.map(k=>`<option value="${esc(k)}" ${I.c===k?'selected':''}>${esc(k.replace('|',' / '))}</option>`).join('')}</select></div><button class="btn" onclick="window.print()">طباعة</button></div>
<div class="card"><h2>${esc(D.school)} — جرد الغياب ${w?'الأسبوعي':'الشهري'}</h2><p class="hint">${w?ds[0]+' إلى '+ds[4]:esc(I.mo)} · غ = بدون عذر · ع = بعذر · ت = تأخر</p>
<table><tr><th>م</th><th>الاسم</th><th>الصف / الفصل</th>${w?ds.map(d=>`<th>${dayName(d)}</th>`).join(''):''}<th>بدون عذر</th><th>بعذر</th><th>تأخر</th></tr>
${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.s.name)}</td><td>${esc(lbl(r.s))}</td>${w?r.c.map(x=>`<td style="${x?'background:'+COL[x]+';color:#fff':''}">${{a:'غ',e:'ع',l:'ت'}[x]||''}</td>`).join(''):''}<td>${r.a||''}</td><td>${r.e||''}</td><td>${r.l||''}</td></tr>`).join('')||`<tr><td colspan="9">لا توجد سجلات في هذه الفترة</td></tr>`}
${rows.length?`<tr><th colspan="${w?8:3}">الإجمالي</th><th>${T('a')}</th><th>${T('e')}</th><th>${T('l')}</th></tr>`:''}</table></div>`}

/* ---------- الإعدادات ---------- */
function pSet(){return `<div class="card"><h2>اسم المدرسة</h2><div class="row"><input id="sch" value="${esc(D.school)}" style="min-width:260px"><button class="btn" onclick="D.school=$('sch').value.trim();save();render();toast('تم الحفظ')">حفظ</button></div></div>
<div class="card"><h2>المستخدمون (الدخول برقم الجوال)</h2><p class="hint">ملف Excel بأعمدة: الاسم، الجوال (05…)، الصلاحية (إدخال / اطلاع / مدير)، الصف (اختياري: يقصر ما يراه على صف واحد). رقم الجوال هو الرقم السري.</p><input type="file" accept=".xlsx,.xls,.csv" onchange="pickFile(event,'p')"><div id="xbp"></div><div id="stf" class="tiles bg">${stf()}</div></div>
<div class="card"><h2>استيراد الطلاب من Excel</h2><input type="file" accept=".xlsx,.xls,.csv" onchange="pickFile(event,'s')"><div id="xbs"></div><p class="hint">الطلاب الحاليون: ${D.students.length}. عند إعادة الاستيراد يبقى سجل الغياب لنفس الطالب (الاسم + الصف + الفصل).</p></div>
<div class="card" id="mv">${mv()}</div>
<div class="card"><h2>نماذج الرسائل</h2><p class="hint">المتغيرات: {student} {grade} {class} {date} {day} {school}</p><label>رسالة الغياب (بعذر وبدون عذر)</label><textarea id="tA" rows="5">${esc(tpl('abs'))}</textarea><label style="margin-top:8px">رسالة التأخر</label><textarea id="tL" rows="5">${esc(tpl('late'))}</textarea><p><button class="btn" onclick="D.tpl={abs:$('tA').value,late:$('tL').value};save();toast('تم حفظ الرسائل')">حفظ الرسائل</button> <button class="btn g" onclick="D.tpl={};save();render()">استعادة الأصل</button></p></div>`}
function mv(){const cl=[...new Set(D.students.map(s=>s.grade+'|'+s.cls))],L=D.students.filter(s=>!M.c||s.grade+'|'+s.cls===M.c),o=k=>`<option value="${esc(k)}">${esc(k.replace('|',' / '))}</option>`;
return `<h2>الطلاب ونقلهم بين الفصول</h2><p class="hint">اضغط على الأسماء لتحديدها ثم اختر الفصل الجديد.</p><div class="row"><div><label>عرض فصل</label><select onchange="M.c=this.value;mvR()"><option value="">الكل</option>${cl.map(k=>`<option value="${esc(k)}" ${M.c===k?'selected':''}>${esc(k.replace('|',' / '))}</option>`).join('')}</select></div></div>
<div class="tiles">${L.map(s=>`<button class="tl w ${M.s.has(s.id)?'s':''}" data-id="${esc(s.id)}" onclick="mvT(this.dataset.id)"><i>${esc(s.num)}</i>${esc(s.name)}<small>${esc(lbl(s))}</small></button>`).join('')}</div>
<div class="row"><div><label>نقل المحدد (${M.s.size}) إلى</label><select id="tg">${cl.map(o).join('')}<option value="+">+ فصل جديد…</option></select></div><button class="btn" onclick="mvGo()">نقل</button><button class="btn r" onclick="mvDel()">حذف المحدد</button></div>`}
const mvR=()=>{if($('mv'))$('mv').innerHTML=mv()};
function mvT(id){M.s.has(id)?M.s.delete(id):M.s.add(id);mvR()}
function mvGo(){if(!M.s.size)return toast('حدد طلاباً أولاً');let t=$('tg').value,g,c;
 if(t==='+'){g=(prompt('اسم الصف الجديد')||'').trim();c=(prompt('اسم الفصل الجديد')||'').trim();if(!g||!c)return}else{const a=t.split('|');g=a[0];c=a[1]}
 D.students.forEach(s=>{if(M.s.has(s.id)){s.grade=g;s.cls=c}});toast('تم نقل '+M.s.size);M.s=new Set();save();mvR();nav('set')}
function mvDel(){if(!M.s.size||!confirm('حذف '+M.s.size+' طالب؟'))return;D.students=D.students.filter(s=>!M.s.has(s.id));M.s=new Set();save();mvR()}

/* ---------- استيراد Excel مع معاينة ---------- */
const FL={s:[['name','الاسم *'],['grade','الصف'],['cls','الفصل'],['num','الرقم'],['phone','جوال ولي الأمر']],p:[['name','الاسم *'],['phone','الجوال *'],['role','الصلاحية'],['scope','الصف (اختياري)']]};
const xrows=()=>XLSX.utils.sheet_to_json(X.wb.Sheets[X.wb.SheetNames[X.si]],{header:1,raw:false,defval:''});
function pickFile(ev,k){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{X={k,wb:XLSX.read(new Uint8Array(e.target.result),{type:'array'}),si:0,hr:1,m:{},out:null};guess();drawX()}catch(x){toast('تعذر قراءة الملف')}};r.readAsArrayBuffer(f)}
function guess(){const h=xrows()[X.hr-1]||[],f=re=>h.findIndex(c=>re.test(String(c)));X.m=X.k==='s'?{name:f(/اسم/),grade:f(/صف|مرحلة/),cls:f(/فصل|شعبة/),phone:f(/جوال|هاتف|موبايل/),num:h.findIndex(c=>/رقم|تسلسل|^\s*م\s*$/.test(String(c))&&!/جوال|هاتف|هوية|سجل/.test(String(c)))}:{name:f(/اسم/),phone:f(/جوال|هاتف|موبايل|رقم/),role:f(/صلاح|دور/),scope:f(/صف|مرحلة/)}}
function drawX(){const e=$('xb'+X.k);if(!e)return;if(X.out)return drawP(e);
 const rows=xrows(),h=rows[X.hr-1]||[],nc=Math.max(h.length,...rows.slice(0,6).map(r=>r.length)),col=i=>String.fromCharCode(65+i),opt=k=>`<option value="-1">— بدون —</option>`+Array.from({length:nc},(_,i)=>`<option value="${i}" ${X.m[k]===i?'selected':''}>${col(i)}: ${esc(String(h[i]||'').slice(0,18))}</option>`).join('');
 e.innerHTML=`<div class="row" style="margin:10px 0"><div><label>الشيت</label><select onchange="X.si=+this.value;guess();drawX()">${X.wb.SheetNames.map((n,i)=>`<option value="${i}" ${i===X.si?'selected':''}>${esc(n)}</option>`).join('')}</select></div><div><label>رقم صف العناوين</label><input type="number" min="1" value="${X.hr}" style="width:80px" onchange="X.hr=Math.max(1,+this.value||1);guess();drawX()"></div></div><div class="row">${FL[X.k].map(([k,l])=>`<div><label>${l}</label><select onchange="X.m['${k}']=+this.value">${opt(k)}</select></div>`).join('')}</div><div style="overflow-x:auto;margin:10px 0"><table>${rows.slice(0,4).map((r,i)=>`<tr style="${i===X.hr-1?'background:#fff6df':''}">${Array.from({length:nc},(_,j)=>`<td>${esc(String(r[j]??'').slice(0,20))}</td>`).join('')}</tr>`).join('')}</table></div><button class="btn" onclick="prev(1)">معاينة</button>${X.k==='s'?' <button class="btn g" onclick="prev(0)">معاينة (إضافة فقط)</button>':''}`}
function prev(rep){const m=X.m,s=X.k==='s';if(!(m.name>=0)||(!s&&!(m.phone>=0)))return toast('اختر عمود الاسم'+(s?'':' والجوال'));
 const g=(r,k)=>m[k]>=0?String(r[m[k]]??'').trim():'',old=new Map(D.students.map(x=>[x.grade+'|'+x.cls+'|'+x.name,x])),out=[];
 xrows().slice(X.hr).forEach(r=>{const name=g(r,'name');if(!name)return;
  if(s){const grade=g(r,'grade')||'بدون صف',cls=g(r,'cls')||grade,o=old.get(grade+'|'+cls+'|'+name);out.push({id:o?o.id:'x'+Math.random().toString(36).slice(2,9),name,grade,cls,num:g(r,'num'),phone:np(g(r,'phone')),nw:!o})}
  else{const p=np(g(r,'phone')),t=g(r,'role');out.push({name,phone:p,role:p===ADMIN||/مدير/.test(t)?'admin':/اطلاع|عرض|مشاهدة/.test(t)?'view':'entry',scope:g(r,'scope'),bad:!/^05\d{8}$/.test(p)})}});
 X.out=rep?out:out.filter(x=>x.nw||!s);X.rep=rep;if(!X.out.length)return toast('لا توجد أسماء جديدة');drawX()}
function drawP(e){const o=X.out,s=X.k==='s',ks=s?[...new Set(o.map(x=>x.grade+'|'+x.cls))]:[''];
 const sum=s?`${o.filter(x=>x.nw).length} جديد · ${o.filter(x=>!x.nw).length} موجود${X.rep?' · سيُحذف '+D.students.filter(x=>!o.some(y=>y.id===x.id)).length:''}`:`${o.filter(x=>!x.bad).length} صالح · ${o.filter(x=>x.bad).length} رقمه غير صحيح (يُتجاهل)`;
 e.innerHTML=`<h3>معاينة قبل الحفظ</h3><p><b>${sum}</b></p>${ks.map(k=>{const L=o.filter(x=>!s||x.grade+'|'+x.cls===k);return `${s?`<div class="hint">${esc(k.replace('|',' / '))} (${L.length})</div>`:''}<div class="tiles">${L.map(x=>`<div class="tl ${x.bad?'a':'w'}"><b>${esc(x.name)}</b><small dir="ltr">${esc(s?x.num:x.phone)}</small>${s?'':`<small>${RL[x.role]}</small>`}</div>`).join('')}</div>`}).join('')}<button class="btn" onclick="commit()">حفظ</button> <button class="btn g" onclick="X.out=null;drawX()">رجوع</button>`}
async function commit(){const k=X.k,o=X.out;
 try{if(k==='s'){const a=o.map(({nw,...r})=>r);D.students=X.rep?a:[...D.students,...a];save()}
 else{const b=F.writeBatch(db);o.filter(x=>!x.bad).forEach(x=>b.set(F.doc(db,'staff',x.phone),{name:x.name,phone:x.phone,role:x.role,scope:x.scope}));await b.commit();STF=null}}catch(e){return toast('تعذر الحفظ')}
 X=null;toast('تم الحفظ');if(k==='s'){M.s=new Set();location.hash='g:'+(grades()[0]||'');if(!grades().length)render()}else render()}
start();
</script>
</body>
</html>
