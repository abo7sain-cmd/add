<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة الإدارة المدرسية وشاشة العرض</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root { --paper:#F5F6F3; --card:#FFFFFF; --ink:#18262B; --mute:#5E6E72; --line:#D9DED9; --accent:#0E6B5A; --accent-soft:#E2F0EC; --danger:#B3261E; --gold:#d4af37; --bg-dark:#0a0e17; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif; font-size: 16px; line-height: 1.6; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }

/* تسجيل الدخول */
.login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
.login h1 { font-size: 1.45rem; margin: 0 0 4px; font-weight: 700; }
.login p { margin: 0 0 22px; color: var(--mute); }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; direction: ltr; }
.pad button { height: 60px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-size: 1.35rem; font-weight: 500; }
.msg { min-height: 26px; color: var(--danger); font-size: .95rem; margin-bottom: 10px; }

/* عناصر عامة */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.top h1 { font-size: 1.2rem; margin: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; font-weight: 500; text-decoration: none; display: inline-block; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.dng { color: var(--danger); border-color: #E7C5C2; }
.btn.sm { padding: 4px 10px; font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.card h3 { margin: 0 0 12px; font-size: 1.05rem; }
label.f { display: block; margin-bottom: 12px; font-size: .92rem; color: var(--mute); }
label.f input, label.f select { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
.row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .t small { color: var(--mute); }
.empty { padding: 34px 10px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 14px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 99; }

/* ================= تصميم شاشة التلفاز ================= */
#tv-screen { display: none; height: 100vh; background: var(--bg-dark); color: #fff; overflow: hidden; font-family: "IBM Plex Sans Arabic", sans-serif; }
.tv-page { display: none; height: 100vh; padding: 40px; flex-direction: column; align-items: center; justify-content: center; animation: fadeIn 0.6s; }
.tv-page.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* صفحة 1: الإحصائيات والجدول */
.tv-stats-container { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; width: 100%; max-width: 1600px; align-items: center; }
.tv-welcome-text h1 { font-size: 4rem; color: var(--gold); margin-bottom: 1rem; }
.tv-welcome-text p { font-size: 2rem; color: #8b949e; }
.tv-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
.tv-stat-box { background: #121824; padding: 30px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.3); text-align: center; }
.tv-stat-box h3 { font-size: 4rem; color: var(--gold); margin-bottom: 10px; }
.tv-stat-box p { font-size: 1.5rem; color: #8b949e; }
.tv-schedule-btn { margin-top: 30px; display: inline-block; background: var(--gold); color: #000; padding: 15px 40px; border-radius: 50px; font-size: 1.5rem; font-weight: bold; text-decoration: none; }

/* صفحة 2: الطلاب المثاليين */
.tv-students-container { width: 100%; max-width: 1600px; text-align: center; }
.tv-students-container h1 { font-size: 3rem; color: var(--gold); margin-bottom: 40px; }
.tv-students-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; width: 100%; }
.tv-student-card { background: #121824; border-radius: 20px; padding: 25px; text-align: center; border-top: 5px solid var(--gold); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
.tv-student-card img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 4px solid var(--gold); margin-bottom: 15px; }
.tv-student-card h3 { font-size: 2rem; margin-bottom: 5px; color: #fff; }
.tv-student-card p { font-size: 1.3rem; color: var(--gold-light); }

/* صفحة 3: الوسائط */
.tv-media-container { width: 100%; max-width: 1600px; text-align: center; }
.tv-media-container h1 { font-size: 3rem; color: var(--gold); margin-bottom: 20px; }
.tv-media-display { display: flex; justify-content: center; align-items: center; width: 100%; height: 70vh; }
.tv-media-display img, .tv-media-display video { max-width: 90%; max-height: 100%; border-radius: 20px; border: 4px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.tv-media-display .pdf-placeholder { background: rgba(255,255,255,0.1); padding: 50px; border-radius: 20px; border: 4px dashed var(--gold); }
.tv-media-display .pdf-placeholder a { color: var(--gold); text-decoration: none; font-size: 2.5rem; font-weight: bold; }

/* أزرار التحكم بشاشة التلفاز */
#tv-controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; gap: 15px; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 50px; border: 1px solid rgba(212,175,55,0.5); backdrop-filter: blur(10px); transition: opacity 0.5s, visibility 0.5s; }
#tv-controls.hidden { opacity: 0; visibility: hidden; }
#tv-controls button { padding: 10px 25px; border-radius: 30px; border: none; cursor: pointer; background: var(--gold); color: #000; font-weight: bold; font-family: inherit; font-size: 1rem; transition: transform 0.2s; }
#tv-controls button:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div id="app"></div>

<!-- أزرار التحكم بشاشة التلفاز -->
<div id="tv-controls" class="hidden">
  <button onclick="manualSwitch(0)">1. الإحصائيات</button>
  <button onclick="manualSwitch(1)">2. الطلاب المثاليين</button>
  <button onclick="manualSwitch(2)">3. الوسائط</button>
</div>

<!-- حاوية شاشة التلفاز -->
<div id="tv-screen">
  <!-- الصفحة 1 -->
  <div class="tv-page active" id="tv-page-0">
    <div class="tv-stats-container">
      <div class="tv-welcome-text">
        <h1>مدرسة أسامة بن زيد</h1>
        <p>أهلاً بكم في صرح العلم والمعرفة</p>
        <a href="https://jadwalmadrasa.com/#/tv/B872WT" target="_blank" class="tv-schedule-btn">📅 عرض جدول الحصص</a>
      </div>
      <div class="tv-stats-grid">
        <div class="tv-stat-box"><h3 id="tv-students">0</h3><p>طالب</p></div>
        <div class="tv-stat-box"><h3 id="tv-teachers">0</h3><p>معلم</p></div>
        <div class="tv-stat-box"><h3 id="tv-classes">0</h3><p>فصل</p></div>
        <div class="tv-stat-box"><h3>1447</h3><p>العام الدراسي</p></div>
      </div>
    </div>
  </div>

  <!-- الصفحة 2 -->
  <div class="tv-page" id="tv-page-1">
    <div class="tv-students-container">
      <h1>🌟 الطلاب المثاليون والمميزون</h1>
      <div class="tv-students-grid" id="tv-students-grid"></div>
    </div>
  </div>

  <!-- الصفحة 3 -->
  <div class="tv-page" id="tv-page-2">
    <div class="tv-media-container">
      <h1 id="tv-cin-title">فعاليات المدرسة</h1>
      <div class="tv-media-display" id="tv-cin-media-container"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, updateDoc, collection, getDocs, addDoc, query, orderBy, limit, writeBatch, serverTimestamp, Timestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* إعدادات Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyDH0AZoNGMlnxVQFyl3dUlxGnveBhiUQdc",
  authDomain: "abo7sain-8354a.firebaseapp.com",
  projectId: "abo7sain-8354a",
  storageBucket: "abo7sain-8354a.firebasestorage.app",
  messagingSenderId: "537274795860",
  appId: "1:537274795860:web:b34b14fa6537ec2ad62ac1"
};
const ADMIN_EMAIL = "zosamh444@gmail.com";
const SCHOOL = "مدرسة أسامة بن زيد الابتدائية";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const appDiv = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

let toastT;
function toast(m) { document.querySelector(".toast")?.remove(); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2800); }

// تحويل الملف إلى Base64
const fileToBase64 = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = () => resolve(reader.result);
  reader.onerror = error => reject(error);
});

/* ================= شاشة التلفاز (tv) ================= */
function initTvScreen() {
  document.getElementById("app").style.display = "none";
  document.getElementById("tv-screen").style.display = "block";

  // إظهار أزرار التحكم
  const controls = document.getElementById("tv-controls");
  controls.classList.remove("hidden");
  
  let hideTimeout;
  const showControls = () => {
    controls.classList.remove("hidden");
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => controls.classList.add("hidden"), 5000);
  };
  
  document.addEventListener("mousemove", showControls);
  document.addEventListener("touchstart", showControls);
  showControls();

  // استخدام onSnapshot للتحديث الفوري (Real-time)
  onSnapshot(doc(db, "portal_tv", "main"), (docSnap) => {
    let data = { students: 400, teachers: 25, classes: 12, idealStudents: [], media: [] };
    if (docSnap.exists()) {
      data = docSnap.data();
    }

    // تحديث الإحصائيات
    document.getElementById("tv-students").innerText = data.students;
    document.getElementById("tv-teachers").innerText = data.teachers;
    document.getElementById("tv-classes").innerText = data.classes;

    // تحديث البطاقات (صفحة الطلاب)
    const grid = document.getElementById("tv-students-grid");
    if (data.idealStudents && data.idealStudents.length > 0) {
      grid.innerHTML = data.idealStudents.map(s => `
        <div class="tv-student-card">
          <img src="${s.image || 'https://via.placeholder.com/140/121824/d4af37?text=👤'}" alt="${s.name}">
          <h3>${s.name}</h3>
          <p>${s.grade} - ${s.reason}</p>
        </div>
      `).join('');
    } else {
      grid.innerHTML = '<div style="color:#fff;font-size:1.5rem;grid-column:1/-1;text-align:center;">لا يوجد طلاب مضافين حالياً</div>';
    }

    // تحديث الوسائط
    const container = document.getElementById("tv-cin-media-container");
    if (data.media && data.media.length > 0) {
      const m = data.media[0];
      document.getElementById("tv-cin-title").innerText = m.title;
      
      if (m.type === "image") {
        container.innerHTML = `<img src="${m.url}">`;
      } else if (m.type === "video") {
        container.innerHTML = `<video src="${m.url}" autoplay muted loop></video>`;
      } else {
        container.innerHTML = `<div class="pdf-placeholder"><a href="${m.url}" target="_blank">📄 اضغط هنا لعرض ملف الـ PDF</a></div>`;
      }
    } else {
      document.getElementById("tv-cin-title").innerText = "لا يوجد وسائط مضافة";
      container.innerHTML = "";
    }
  }, (error) => {
    console.error("خطأ في جلب البيانات:", error);
  });
}

/* ================= لوحة التحكم (#admin) ================= */
async function initAdmin() {
  onAuthStateChanged(auth, async user => {
    if (!user) return renderAdminLogin();
    if (user.email !== ADMIN_EMAIL) { await signOut(auth); return renderAdminLogin("هذا الحساب غير مصرّح له."); }
    await loadAdminData();
    renderAdmin();
  });
}

function renderAdminLogin(msg = "") {
  appDiv.innerHTML = `<main class="login"><h1>لوحة مدير الصفحة</h1><p>سجّل الدخول بحساب Google</p><div class="msg">${esc(msg)}</div><button class="btn pri" id="g-login">الدخول بحساب Google</button></main>`;
  document.getElementById("g-login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
}

let A = { tab: "tv", user: null, tvData: null };

async function loadAdminData() {
  const docRef = doc(db, "portal_tv", "main");
  const snap = await getDoc(docRef);
  if (snap.exists()) {
    A.tvData = snap.data();
  } else {
    A.tvData = { students: 400, teachers: 25, classes: 12, idealStudents: [], media: [] };
    await setDoc(docRef, A.tvData);
  }
}

function renderAdmin() {
  const tabs = [["tv", "شاشة العرض"]];
  let b = "";

  if (A.tab === "tv") {
    b = `<div class="card">
      <h3>إعدادات شاشة العرض</h3>
      <a href="#tv" class="btn pri" target="_blank" style="margin-bottom:15px;">🖥️ فتح شاشة التلفاز</a>
      <form id="form-tv-settings">
        <label class="f">عدد الطلاب<input type="number" name="students" value="${A.tvData.students}"></label>
        <label class="f">عدد المعلمين<input type="number" name="teachers" value="${A.tvData.teachers}"></label>
        <label class="f">عدد الفصول<input type="number" name="classes" value="${A.tvData.classes}"></label>
        <button class="btn pri" type="submit">حفظ الإحصائيات</button>
      </form>
    </div>

    <div class="card">
      <h3>إضافة طالب مثالي / مميز</h3>
      <form id="form-add-student">
        <label class="f">اسم الطالب<input name="name" required></label>
        <label class="f">الصف<input name="grade" required></label>
        <label class="f">سبب التكريم<input name="reason" required></label>
        <label class="f">رفع صورة الطالب (من جهازك)<input type="file" name="image_file" accept="image/*" required></label>
        <button class="btn pri" type="submit">إضافة الطالب</button>
      </form>
      <div style="margin-top:10px" id="students-list">
        ${A.tvData.idealStudents.map((s, i) => `<div class="row"><div class="t"><b>${esc(s.name)}</b><small>${esc(s.grade)} - ${esc(s.reason)}</small></div><button class="btn sm dng del-student" data-idx="${i}">حذف</button></div>`).join('') || '<div class="empty">لا يوجد طلاب مضافين.</div>'}
      </div>
    </div>

    <div class="card">
      <h3>إضافة وسائط (صورة / فيديو / PDF)</h3>
      <form id="form-add-media">
        <label class="f">عنوان الوسيط<input name="title" required></label>
        <label class="f">النوع<select name="type"><option value="image">صورة</option><option value="video">فيديو</option><option value="pdf">PDF</option></select></label>
        <label class="f">رفع الملف من جهازك<input type="file" name="media_file" required></label>
        <button class="btn pri" type="submit">إضافة الوسيط</button>
      </form>
      <div style="margin-top:10px" id="media-list">
        ${A.tvData.media.map((m, i) => `<div class="row"><div class="t"><b>${esc(m.title)}</b><small>${m.type}</small></div><button class="btn sm dng del-media" data-idx="${i}">حذف</button></div>`).join('') || '<div class="empty">لا يوجد وسائط مضافة.</div>'}
      </div>
    </div>`;
  }

  appDiv.innerHTML = `<div class="wrap"><div class="top"><h1>لوحة التحكم</h1><button class="btn" id="logout">تسجيل خروج</button></div>
    <div class="tabs" style="display:flex;gap:6px;margin-bottom:16px;">${tabs.map(([k, v]) => `<button class="tab-btn ${A.tab === k ? 'on' : ''}" data-tab="${k}" style="padding:8px 14px;border-radius:10px;border:none;background:${A.tab === k ? '#0E6B5A' : '#eee'};color:${A.tab === k ? '#fff' : '#333'}">${v}</button>`).join("")}</div>${b}</div>`;

  // ربط الأزرار
  document.getElementById("logout").onclick = () => signOut(auth);
  
  // حفظ الإحصائيات
  document.getElementById("form-tv-settings").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    A.tvData.students = Number(fd.get("students"));
    A.tvData.teachers = Number(fd.get("teachers"));
    A.tvData.classes = Number(fd.get("classes"));
    await setDoc(doc(db, "portal_tv", "main"), A.tvData);
    toast("تم الحفظ والتحديث الفوري");
  };

  // إضافة طالب
  document.getElementById("form-add-student").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const file = fd.get("image_file");
    if (!file || file.size === 0) return toast("الرجاء اختيار صورة");
    if (file.size > 1.5 * 1024 * 1024) return toast("حجم الصورة كبير (الأقصى 1.5 ميجا)");
    
    toast("جاري رفع الصورة...");
    const base64 = await fileToBase64(file);
    A.tvData.idealStudents.push({ name: fd.get("name"), grade: fd.get("grade"), reason: fd.get("reason"), image: base64 });
    await setDoc(doc(db, "portal_tv", "main"), A.tvData);
    toast("تمت إضافة الطالب");
    renderAdmin();
  };

  // إضافة وسيط
  document.getElementById("form-add-media").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const file = fd.get("media_file");
    if (!file || file.size === 0) return toast("الرجاء اختيار ملف");
    if (file.size > 2 * 1024 * 1024) return toast("حجم الملف كبير (الأقصى 2 ميجا)");
    
    toast("جاري رفع الملف...");
    const base64 = await fileToBase64(file);
    A.tvData.media.push({ title: fd.get("title"), type: fd.get("type"), url: base64 });
    await setDoc(doc(db, "portal_tv", "main"), A.tvData);
    toast("تمت إضافة الوسيط");
    renderAdmin();
  };

  // حذف طالب
  document.querySelectorAll(".del-student").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("حذف هذا الطالب؟")) return;
      A.tvData.idealStudents.splice(btn.dataset.idx, 1);
      await setDoc(doc(db, "portal_tv", "main"), A.tvData);
      renderAdmin();
    };
  });

  // حذف وسيط
  document.querySelectorAll(".del-media").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("حذف هذا الوسيط؟")) return;
      A.tvData.media.splice(btn.dataset.idx, 1);
      await setDoc(doc(db, "portal_tv", "main"), A.tvData);
      renderAdmin();
    };
  });
}

/* ================= نظام التبديل (تلقائي ويدوي) ================= */
let rotationInterval;
let manualTimeout;

window.manualSwitch = function(index) {
  clearInterval(rotationInterval);
  clearTimeout(manualTimeout);
  
  document.querySelectorAll('.tv-page').forEach(el => el.classList.remove('active'));
  document.getElementById('tv-page-' + index).classList.add('active');
  
  manualTimeout = setTimeout(() => {
    startAutoRotation();
  }, 30000);
};

function startAutoRotation() {
  let currentPage = 0;
  document.querySelectorAll('.tv-page').forEach(el => el.classList.remove('active'));
  document.getElementById('tv-page-0').classList.add('active'); // يبدأ من الصفحة الأولى
  
  rotationInterval = setInterval(() => {
    document.querySelectorAll('.tv-page').forEach(el => el.classList.remove('active'));
    currentPage = (currentPage + 1) % 3; // 3 صفحات
    document.getElementById('tv-page-' + currentPage).classList.add('active');
  }, 15000);
}

/* ================= التشغيل ================= */
if (location.hash === "#tv") {
  initTvScreen();
  startAutoRotation();
} else if (location.hash === "#admin") {
  initAdmin();
} else {
  appDiv.innerHTML = `<main class="login"><h1>${SCHOOL}</h1><p>مرحباً بك</p><a href="#admin" class="btn pri">دخول لوحة التحكم</a> <a href="#tv" class="btn" target="_blank" style="margin-top:10px;">شاشة العرض</a></main>`;
}
</script>
</body>
</html>
