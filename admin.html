<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحكم شاشة المدرسة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f1e8;--ink:#1d2b2c;--teal:#0d2b2e;--gold:#d9a441;--line:#d8d2c0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;font-size:17px}
header{background:var(--teal);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
header h1{font-family:'Reem Kufi',sans-serif;font-size:22px;margin:0;flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:8px 18px;background:var(--gold);color:var(--ink);font-weight:700}
button.ghost{background:transparent;color:inherit;border:1px solid currentColor;font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #2a7f86;outline-offset:2px}
main{max-width:860px;margin:24px auto;padding:0 16px;display:grid;gap:20px}
section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}
h2{margin:0 0 12px;font-size:19px}
label{display:block;font-size:14px;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px}
textarea{min-height:76px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:12px}
.item .del{margin-top:10px}
#msg{padding:0 24px;color:#9a2b1c}
#toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--teal);color:#fff;padding:10px 18px;border-radius:6px;display:none}
#prev{max-height:70px;display:block;margin-top:8px}
  .th{display:block;max-height:90px;margin:8px 0;border-radius:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>تحكم شاشة المدرسة</h1>
  <button id="save" hidden>حفظ التغييرات</button>
  <button class="ghost" id="out" hidden>تسجيل الخروج</button>
</header>
<main>
  <section id="login">
    <h2>تسجيل الدخول</h2>
    <p id="msg" style="padding:0;margin:0 0 12px"></p>
    <button id="in">الدخول بحساب Google</button>
  </section>
  <div id="app" hidden>
    <section>
      <h2>بيانات المدرسة</h2>
      <label for="name">اسم المدرسة</label><input id="name">
      <label for="logo">الشعار</label><input id="logo" type="file" accept="image/*">
      <img id="prev" alt="">
      <div class="grid">
        <div><label for="sec">مدة ظهور كل عنصر (ثانية)</label><input id="sec" type="number" min="5" max="120"></div>
        <div><label for="lat">خط العرض للطقس</label><input id="lat" type="number" step="any"></div>
        <div><label for="lon">خط الطول للطقس</label><input id="lon" type="number" step="any"></div>
      </div>
    </section>
    <div id="lists" style="display:grid;gap:20px;margin-top:20px"></div>
  </div>
</main>
<div id="toast"></div>

<script type="module">
import {firebaseConfig,ADMIN_EMAIL} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LISTS={
 announcements:{title:'الإعلانات والتعاميم',fields:[['title','العنوان'],['text','النص','area'],['img','صورة (اختيارية)','img',900,0]]},
 honor:{title:'لوحة الشرف',fields:[['name','اسم الطالب'],['note','سبب التكريم'],['img','صورة الطالب (اختيارية)','img',200,1]]},
 tips:{title:'آية أو حديث أو فائدة',fields:[['text','النص','area']]}
};
let d={schoolName:'',logo:'',lat:21.54,lon:39.17,rotateSec:12,announcements:[],honor:[],tips:[]};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};

function draw(){
  $('#name').value=d.schoolName;$('#sec').value=d.rotateSec;$('#lat').value=d.lat;$('#lon').value=d.lon;
  $('#prev').src=d.logo||'';$('#prev').hidden=!d.logo;
  $('#lists').innerHTML=Object.entries(LISTS).map(([k,L])=>`<section><h2>${L.title}</h2>`+
    d[k].map((it,i)=>`<div class="item">`+L.fields.map(([f,lab,t,mx,sq])=>{
      const a=`data-k="${k}" data-i="${i}" data-f="${f}"`;
      if(t==='img')return `<label>${lab}</label><input type="file" accept="image/*" ${a} data-max="${mx}" data-sq="${sq}">`+(it[f]?`<img class="th" src="${it[f]}" alt=""><button class="ghost rmimg" ${a}>إزالة الصورة</button>`:'');
      return `<label>${lab}</label>`+(t?`<textarea ${a}>${esc(it[f])}</textarea>`:`<input ${a} value="${esc(it[f])}">`);
    }).join('')+`<button class="ghost del" data-k="${k}" data-i="${i}">حذف</button></div>`).join('')+
    `<button class="add" data-k="${k}">إضافة</button></section>`).join('');
}
$('#lists').addEventListener('input',e=>{const t=e.target.dataset;if(t.f&&e.target.type!=='file')d[t.k][t.i][t.f]=e.target.value});
$('#lists').addEventListener('click',e=>{
  const t=e.target;
  if(t.classList.contains('add')){d[t.dataset.k].push(Object.fromEntries(LISTS[t.dataset.k].fields.map(f=>[f[0],''])));draw()}
  if(t.classList.contains('rmimg')){d[t.dataset.k][+t.dataset.i][t.dataset.f]='';draw()}
  if(t.classList.contains('del')){d[t.dataset.k].splice(+t.dataset.i,1);draw()}
});
function shrink(file,max,sq,cb){
  const img=new Image();img.onload=()=>{
    const c=document.createElement('canvas'),x=c.getContext('2d');
    if(sq){const m=Math.min(img.width,img.height);c.width=c.height=max;x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,max,max)}
    else{const r=Math.min(1,max/Math.max(img.width,img.height));c.width=img.width*r;c.height=img.height*r;x.drawImage(img,0,0,c.width,c.height)}
    cb(c.toDataURL('image/jpeg',.75));
  };img.src=URL.createObjectURL(file);
}
$('#lists').addEventListener('change',e=>{
  const t=e.target;if(t.type!=='file'||!t.files[0])return;const q=t.dataset;
  shrink(t.files[0],+q.max,q.sq==='1',u=>{d[q.k][+q.i][q.f]=u;draw()});
});
$('#name').oninput=e=>d.schoolName=e.target.value;
$('#sec').oninput=e=>d.rotateSec=e.target.value;
$('#lat').oninput=e=>d.lat=e.target.value;
$('#lon').oninput=e=>d.lon=e.target.value;
$('#logo').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const r=Math.min(1,240/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*r;c.height=img.height*r;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    d.logo=c.toDataURL('image/png');$('#prev').src=d.logo;$('#prev').hidden=false;
  };img.src=URL.createObjectURL(f);
};

if(firebaseConfig.apiKey.startsWith('PASTE')){
  $('#msg').textContent='أضف مفاتيح Firebase في ملف firebase-config.js أولًا.';$('#in').hidden=true;
}else{
  const app=initializeApp(firebaseConfig),auth=getAuth(app),ref=doc(getFirestore(app),'screen','main');
  $('#in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>{$('#msg').textContent='تعذّر تسجيل الدخول، حاول مرة أخرى.'});
  $('#out').onclick=()=>signOut(auth);
  onAuthStateChanged(auth,async u=>{
    const ok=u&&u.email===ADMIN_EMAIL;
    $('#login').hidden=ok;$('#app').hidden=!ok;$('#save').hidden=!ok;$('#out').hidden=!u;
    if(u&&!ok)$('#msg').textContent='هذا الحساب غير مصرّح له بالتعديل.';
    if(ok){const s=await getDoc(ref);if(s.exists())d={...d,...s.data()};draw()}
  });
  $('#save').onclick=async()=>{
    const clean=k=>d[k].filter(it=>Object.values(it).some(v=>String(v).trim()));
    try{
      const p={...d,announcements:clean('announcements'),honor:clean('honor'),tips:clean('tips'),
        lat:+d.lat,lon:+d.lon,rotateSec:+d.rotateSec||12};
      if(JSON.stringify(p).length>900000)return toast('حجم الصور كبير، احذف بعض الصور ثم احفظ');
      await setDoc(ref,p);
      toast('تم الحفظ، وستتحدث الشاشة خلال ثوانٍ');
    }catch(e){toast('تعذّر الحفظ، تأكد من قواعد Firestore')}
  };
}
</script>
</body>
</html>
