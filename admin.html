<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم بالشاشة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:Tajawal,sans-serif;background:#eef2ef;color:#12312b;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 90px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:19px;margin:0 0 10px;color:#0b3b32}
.card{background:#fff;border-radius:10px;padding:18px;margin:14px 0;box-shadow:0 1px 3px #0001}
label{display:block;font-size:14px;margin:8px 0 4px;color:#4a645d}
input,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid #b9c9c3;border-radius:6px;background:#fff}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}.row>*:first-child{flex:2}.row>*:nth-child(2){flex:1}
button{font:inherit;cursor:pointer;border:0;border-radius:6px;padding:9px 16px;background:#0b3b32;color:#fff}
button.ghost{background:#e3ebe7;color:#0b3b32}button.del{background:#f3dcdc;color:#8a2323;padding:9px 12px}
.bar{position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid #cfdad5;padding:12px;text-align:center}
#msg{margin-inline-start:12px;font-size:14px}
#app{display:none}
</style></head><body><div class="wrap">
<h1>لوحة التحكم بالشاشة</h1>
<div id="login" class="card"><p>سجّل الدخول بحساب Google المصرّح له.</p><button id="in">الدخول بحساب Google</button></div>
<div id="app">
 <div class="card"><h2>بيانات المدرسة</h2>
  <label>اسم المدرسة</label><input id="school">
  <label>رابط الشعار (اختياري)</label><input id="logo" dir="ltr" placeholder="https://...">
  <label>مدة ظهور كل عنصر (بالثواني)</label><input id="sec" type="number" min="5" value="12"></div>
 <div class="card"><h2>الإعلانات</h2><div id="ann"></div><button class="ghost" data-add="ann">إضافة إعلان</button></div>
 <div class="card"><h2>لوحة الشرف</h2><div id="honor"></div><button class="ghost" data-add="honor">إضافة اسم</button></div>
 <div class="card"><h2>آية أو حديث أو فائدة</h2><div id="quotes"></div><button class="ghost" data-add="quotes">إضافة نص</button></div>
 <div class="bar"><button id="save">حفظ ونشر على الشاشة</button><span id="msg"></span> <button class="ghost" id="out">خروج</button></div>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'portal_tv','school_screen');
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const T={ann:['نص الإعلان'],honor:['اسم الطالب','السبب (مثال: متفوق دراسيًا)'],quotes:['النص','المصدر (مثال: سورة البقرة)']};
function add(k,a='',b=''){const d=document.createElement('div');d.className='row';
 d.innerHTML=(k==='ann'?`<textarea placeholder="${T[k][0]}">${E(a)}</textarea>`:`<input placeholder="${T[k][0]}" value="${E(a)}"><input placeholder="${T[k][1]}" value="${E(b)}">`)+'<button class="del" title="حذف">حذف</button>';
 d.querySelector('.del').onclick=()=>d.remove();$(k).appendChild(d)}
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));
$('in').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider());
$('out').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{$('login').style.display=u?'none':'block';$('app').style.display=u?'block':'none';
 if(!u)return;const s=await getDoc(ref);const d=s.exists()?s.data():{};
 $('school').value=d.schoolName||'';$('logo').value=d.logo||'';$('sec').value=d.seconds||12;
 ['ann','honor','quotes'].forEach(k=>$(k).innerHTML='');
 (d.announcements||[]).forEach(x=>add('ann',x));(d.honor||[]).forEach(x=>add('honor',x.name,x.note));(d.quotes||[]).forEach(x=>add('quotes',x.text,x.source));
 if(!(d.announcements||[]).length)add('ann');});
$('save').onclick=async()=>{const rows=k=>[...$(k).children].map(r=>[...r.querySelectorAll('input,textarea')].map(i=>i.value.trim()));
 const data={schoolName:$('school').value.trim(),logo:$('logo').value.trim(),seconds:+$('sec').value||12,
  announcements:rows('ann').map(r=>r[0]).filter(Boolean),
  honor:rows('honor').filter(r=>r[0]).map(r=>({name:r[0],note:r[1]})),
  quotes:rows('quotes').filter(r=>r[0]).map(r=>({text:r[0],source:r[1]}))};
 try{await setDoc(ref,data);$('msg').textContent='تم الحفظ، وستتحدث الشاشة خلال ثوانٍ.'}
 catch(e){$('msg').textContent='تعذّر الحفظ: تأكد من البريد في قواعد Firestore.'}};
</script></body></html>
