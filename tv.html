<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>شاشة المدرسة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0F2A2E;overflow:hidden;cursor:none;color:#F2F5F1;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
#st{position:absolute;left:0;top:0;width:1920px;height:1080px;-webkit-transform-origin:0 0;transform-origin:0 0;display:flex;flex-direction:column}
#hd{height:110px;padding:0 80px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24474C;font-size:38px;font-weight:700}
#hd span{font-size:34px;color:#9FB8B5;font-weight:400}
#mn{flex:1;padding:50px 80px 40px;box-sizing:border-box;min-height:0;display:flex;flex-direction:column}
#tk{height:84px;background:#D9B26A;color:#18262B;display:flex;align-items:center;overflow:hidden}
#tk b{background:#18262B;color:#D9B26A;font-size:30px;padding:0 36px;height:100%;display:flex;align-items:center;flex:none}
#tk div{flex:1;overflow:hidden;font-size:32px;font-weight:500}
#tk i{display:inline-block;white-space:nowrap;font-style:normal;animation:m 28s linear infinite}
@keyframes m{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
h1{font-size:64px;margin:0 0 30px}
.row{flex:1;display:flex;min-height:0}
.card{background:#17383D;border-radius:28px;padding:40px;box-sizing:border-box}
.kp{flex:1;margin-left:32px;display:flex;flex-direction:column;justify-content:center}
.kp:last-child{margin-left:0}
.kp b{font-size:190px;line-height:1}.kp u{text-decoration:none;font-size:48px;margin-top:20px}.kp s{text-decoration:none;font-size:28px;color:#9FB8B5;margin-top:8px}
.msg{flex:1;display:flex;align-items:center;justify-content:center;font-size:56px;color:#9FB8B5;text-align:center}
.bars{display:flex;align-items:flex-end;flex:1}
.bar{flex:1;margin:0 14px;text-align:center;font-size:30px}.bar b{display:block;font-size:34px;margin-bottom:10px}.bar div{background:#2BB39A;border-radius:12px 12px 0 0}
iframe,video{width:100%;height:100%;border:0;border-radius:24px;background:#000}
</style>
</head>
<body>
<div id="st">
<div id="hd"><div id="nm"></div><span id="ck"></span></div>
<div id="mn"><div class="msg">جارٍ التحميل...</div></div>
<div id="tk" style="display:none"><b>إعلان</b><div><i id="tt"></i></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={apiKey:"AIzaSyDH0AZoNGMlnxVQFyl3dUlxGnveBhiUQdc",authDomain:"abo7sain-8354a.firebaseapp.com",projectId:"abo7sain-8354a",appId:"1:537274795860:web:b34b14fa6537ec2ad62ac1"};
var COL=["#2BB39A","#D9B26A","#5B8DEF","#E07A5F","#B9A8F5","#7A8B8F"];
var cfg=null,idx=0,timer=null,started=false;
function $(i){return document.getElementById(i)}
function e(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fit(){var k=Math.min(innerWidth/1920,innerHeight/1080),x=(innerWidth-1920*k)/2,y=(innerHeight-1080*k)/2,t="translate("+x+"px,"+y+"px) scale("+k+")";var s=$("st").style;s.webkitTransform=t;s.transform=t}
function clock(){var d=new Date();$("ck").textContent=d.toLocaleDateString("ar-SA",{weekday:"long"})+" · "+d.toLocaleTimeString("ar-SA",{hour:"2-digit",minute:"2-digit"})}
function sum(a,k){var t=0;for(var i=0;i<a.length;i++)t+=+a[i][k]||0;return t}
function msg(t){return '<div class="msg">'+e(t)+'</div>'}
function yt(u){var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return m&&m[1]}
function dr(u){var m=u.match(/\/d\/([\w-]{10,})/)||u.match(/[?&]id=([\w-]{10,})/);return m&&m[1]}
function sStats(){var s=cfg.stats;if(!s||!s.grades||!s.grades.length)return msg("لم تُرفع بيانات الإكسل بعد");
 var st=sum(s.grades,"s"),cl=sum(s.grades,"c"),te=sum(s.teachers||[],"c"),a=s.att&&s.att.length?s.att[s.att.length-1]:null;
 function k(n,l,sub,c){return '<div class="card kp"><b style="color:'+c+'">'+n+'</b><u>'+l+'</u><s>'+sub+'</s></div>'}
 return '<h1>المدرسة في أرقام</h1><div class="row">'+k(st,"طالب","في "+s.grades.length+" صفوف",COL[0])+k(te,"معلم","في "+(s.teachers||[]).length+" تخصصات",COL[1])+k(cl,"فصل",cl?"بمتوسط "+Math.round(st/cl)+" طالباً":"","#F2F5F1")+(a?k(a.p+"٪","نسبة الحضور",e(a.m),COL[0]):"")+'</div>'}
function sCharts(){var s=cfg.stats;if(!s||!s.grades||!s.grades.length)return msg("لم تُرفع بيانات الإكسل بعد");
 var mx=1,i,h='';for(i=0;i<s.grades.length;i++)mx=Math.max(mx,+s.grades[i].s||0);
 var bars='';for(i=0;i<s.grades.length;i++){var g=s.grades[i];bars+='<div class="bar"><b>'+g.s+'</b><div style="height:'+Math.round((+g.s||0)/mx*380)+'px"></div>'+e(g.n)+'</div>'}
 var T=s.teachers||[],tot=sum(T,"c")||1,acc=0,gr=[],lg='';
 for(i=0;i<T.length;i++){var c=COL[i%COL.length],p=T[i].c/tot*100;gr.push(c+" "+acc+"% "+(acc+p)+"%");acc+=p;lg+='<div style="display:flex;justify-content:space-between;margin-bottom:14px"><span style="color:'+c+'">■ <span style="color:#F2F5F1">'+e(T[i].n)+'</span></span><b>'+T[i].c+'</b></div>'}
 return '<div class="row"><div class="card" style="flex:1.25;margin-left:40px;display:flex;flex-direction:column"><div style="font-size:44px;font-weight:700;margin-bottom:20px">الطلاب في كل صف</div><div class="bars">'+bars+'</div></div>'+
 '<div class="card" style="flex:1;display:flex;flex-direction:column"><div style="font-size:44px;font-weight:700;margin-bottom:20px">المعلمون حسب التخصص</div><div style="flex:1;display:flex;align-items:center"><div style="width:300px;height:300px;border-radius:50%;flex:none;margin-left:30px;background:'+(gr.length?'conic-gradient('+gr.join(",")+')':'#24474C')+'"></div><div style="flex:1;font-size:30px">'+lg+'</div></div></div></div>'}
function sItem(x){var u=x.url||"",im=u?'<div class="card" style="flex:1.5;margin-left:40px;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="'+e(dr(u)?"https://drive.google.com/thumbnail?id="+dr(u)+"&sz=w1600":u)+'" style="max-width:100%;max-height:100%"></div>':'';
 return '<div class="row">'+im+'<div style="flex:1;display:flex;flex-direction:column;justify-content:center"><div style="font-size:62px;font-weight:700;line-height:1.3">'+e(x.title)+'</div><div style="font-size:34px;line-height:1.7;color:#C9D8D5;margin-top:24px">'+e(x.desc)+'</div></div></div>'}
function sVideo(x){var u=x.url||"",y=yt(u),d=dr(u);
 return '<div class="row">'+(y?'<iframe allow="autoplay" src="https://www.youtube.com/embed/'+y+'?autoplay=1&mute=1&controls=0&rel=0"></iframe>':d?'<iframe src="https://drive.google.com/file/d/'+d+'/preview"></iframe>':'<video autoplay muted loop playsinline src="'+e(u)+'"></video>')+'</div>'}
function sText(x){return '<div class="msg" style="flex-direction:column"><div style="font-size:90px;font-weight:700;color:#D9B26A">'+e(x.title)+'</div><div style="font-size:48px;line-height:1.7;margin-top:30px;color:#F2F5F1">'+e(x.desc)+'</div></div>'}
function sSched(){return '<div class="row"><iframe src="'+e(cfg.scheduleUrl||"")+'"></iframe></div>'}
function show(){clearTimeout(timer);var L=cfg.slides||[];if(!L.length){$("mn").innerHTML=msg("لا توجد شرائح بعد");timer=setTimeout(show,10000);return}
 if(idx>=L.length)idx=0;var x=L[idx],t=x.t,h;
 h=t=="stats"?sStats():t=="charts"?sCharts():t=="item"?sItem(x):t=="video"?sVideo(x):t=="schedule"?sSched():sText(x);
 $("mn").innerHTML=h;idx++;timer=setTimeout(show,Math.max(5,+x.sec||15)*1000)}
function apply(d){cfg=d;$("nm").textContent=d.name||"";var tk=$("tk");if(d.ticker){tk.style.display="flex";$("tt").textContent=d.ticker}else tk.style.display="none";if(!started){started=true;show()}}
var key=location.hash.replace("#","");
fit();clock();setInterval(clock,20000);window.onresize=fit;
setTimeout(function(){location.reload()},6*3600*1000);
if(!key){$("mn").innerHTML=msg("رابط الشاشة غير مكتمل")}
else{firebase.initializeApp(firebaseConfig);firebase.firestore().collection("portal_tv").doc(key).onSnapshot(function(s){if(s.exists)apply(s.data());else $("mn").innerHTML=msg("رابط الشاشة غير صحيح")},function(){$("mn").innerHTML=msg("تعذر الاتصال، سيعاد المحاولة")})}
</script>
</body>
</html>
