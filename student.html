<style>

header{background:var(--ink);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:20}
header h1{margin:0 0 8px;font-size:17px}

function modes(){return Object.keys(ST).map(k=>`<button class="${S.mode===k?'on':''}" onclick="S.mode='${k}';$('md').innerHTML=modes()"><i class="dot" style="background:${COL[k]}"></i>${ST[k]}</button>`).join('')}
function cols(g){const day=D.att[S.date]||{},ss=D.students.filter(s=>s.grade===g&&(!S.c||s.cls===S.c));
 return [...new Set(ss.map(s=>s.cls))].map(c=>{const L=ss.filter(s=>s.cls===c),n=L.filter(s=>day[s.id]).length;

function mark(id){const d=D.att[S.date]=D.att[S.date]||{},b=BY[S.date]=BY[S.date]||{},same=d[id]===S.mode;
 const student=D.students.find(x=>x.id===id);

 F.setDoc(dc('att/'+S.date),{m:{[id]:same?F.deleteField():S.mode},by:{[id]:same?F.deleteField():ME.name}},{merge:true}).catch(()=>toast('تعذر الحفظ — تحقق من الاتصال'));
 $('cols').innerHTML=cols(S.g)}
async function sendManagerNotification(student,status){if(!TID||!student)return;try{await F.addDoc(cl('notifications'),{title:status==='a'?'⚠️ غياب جديد':'📝 غياب بعذر',body:`${student.name} (${lbl(student)}) - ${ST[status]}`,studentId:student.id,date:S.date,by:ME.name,read:false,at:Date.now()});}catch(e){}}

function idates(){if(I.m==='w'){const d=new Date(I.d+'T12:00');d.setDate(d.getDate()-d.getDay());return[0,1,2,3,4].map(i=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}return Object.keys(D.att).filter(k=>k.startsWith(I.mo)).sort()}

function exportExcel(){
  const w=I.m==='w',ds=idates(),keys=[...new Set(D.students.map(s=>s.grade+'|'+s.cls))];
  const rows=vis().filter(s=>!I.c||s.grade+'|'+s.cls===I.c).map(s=>{const r={m:0,name:s.name,g:lbl(s),a:0,e:0,l:0};ds.forEach(d=>{const st=(D.att[d]||{})[s.id]||'';r['d'+d]=st==='a'?'غ':st==='e'?'ع':st==='l'?'ت':'';if(st)r[st]++;});return r;}).filter(r=>r.a+r.e+r.l);
  if(!rows.length)return toast('لا توجد بيانات للتصدير');
  const wb=XLSX.utils.book_new();
  const header=['م','الاسم','الصف/الفصل',...(w?ds.map(d=>dayName(d)+' '+d.slice(5)):[]),'بدون عذر','بعذر','تأخر'];
  const data=rows.map((r,i)=>[i+1,r.name,r.g,...(w?ds.map(d=>r['d'+d]||''):[]),r.a,r.e,r.l]);
  data.push(['','الإجمالي','',...(w?ds.map(()=>''):[]),rows.reduce((x,r)=>x+r.a,0),rows.reduce((x,r)=>x+r.e,0),rows.reduce((x,r)=>x+r.l,0)]);
  const ws=XLSX.utils.aoa_to_sheet([header,...data]);
  ws['!cols']=[{wch:5},{wch:25},{wch:15},...(w?ds.map(()=>({wch:8})):[]),{wch:10},{wch:10},{wch:10}];
  XLSX.utils.book_append_sheet(wb,ws,w?'الجرد الأسبوعي':'الجرد الشهري');
  XLSX.writeFile(wb,`جرد_${D.school||'المدرسة'}_${w?ds[0]:I.mo}.xlsx`);
  logAction('تصدير Excel',`جرد ${w?'أسبوعي':'شهري'} - ${w?ds[0]:I.mo}`);
  toast('✅ تم تصدير الملف');
}

async function pLogs(){
  try{const q=await F.getDocs(F.query(cl('logs'),F.orderBy('at','desc'),F.limit(100)));
    const logs=q.docs.map(d=>d.data());
    if(!logs.length)return `<div class="card"><h2>📋 سجل التعديلات</h2><p>لا توجد سجلات بعد.</p></div>`;
    return `<div class="card"><h2>📋 سجل التعديلات (${logs.length} إجراء)</h2><p class="hint">آخر 100 إجراء على غياب الطلاب.</p><div style="max-height:600px;overflow-y:auto">${logs.map(l=>`<div class="log-item"><span class="time">${new Date(l.at).toLocaleString('ar-SA')}</span><span class="who">${esc(l.by||'—')}</span><span class="what"><b>${esc(l.action)}</b>: ${esc(l.details||'')}</span></div>`).join('')}</div></div>`;

}

function convertLinks(){
  const textarea=$('gsUrls');
  if(!textarea)return;
  const lines=textarea.value.split('\n').filter(l=>l.trim());
  const converted=lines.map(line=>{
    const match=line.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    if(match)return `https://docs.google.com/spreadsheets/d/${match[1]}/export?format=csv`;
    return line;
  }).filter(l=>l.includes('/export?format=csv')||l.includes('/pub?'));
  textarea.value=converted.join('\n');
  toast(`✅ تم تحويل ${converted.length} رابط`);
}

async function importFromGoogleSheets(){
  const textarea=$('gsUrls');
  if(!textarea)return alert('❌ لم يتم العثور على حقل الروابط');
  const urls=textarea.value.split('\n').map(u=>u.trim()).filter(u=>u);
  if(!urls.length)return alert('❌ لم تدخل أي رابط');
  
  if(!confirm(`سيتم استيراد الغياب من ${urls.length} جدول.\n\nسيتم إنشاء الطلاب تلقائياً إذا لم يكونوا موجودين.\n\nهل تريد المتابعة؟`))return;
  
  let totalImported=0,totalCreated=0;
  const allData={};
  const allNewStudents=[];
  
  for(let i=0;i<urls.length;i++){
    const url=urls[i];
    toast(`⏳ جارٍ قراءة الجدول ${i+1}/${urls.length}...`);
    try{
      const response=await fetch(url);
      if(!response.ok){alert(`❌ فشل تحميل الرابط ${i+1}. تأكد أنه منشور كـ CSV ومتاح للجميع.`);continue;}
      const csvText=await response.text();
      if(csvText.length<50){alert(`⚠️ الجدول ${i+1} فارغ.`);continue;}
      
      const rows=parseCSV(csvText);
      if(rows.length<2){alert(`⚠️ الجدول ${i+1} لا يحتوي على بيانات.`);continue;}
      
      const result=processSheetData(rows,allData,allNewStudents);
      totalImported+=result.imported;
      
      if(result.imported===0){
        alert(`⚠️ الجدول ${i+1} لم يتم استيراد أي سجل منه.\n\nالسبب المحتمل:\n- أعمدة الجدول لا تحتوي على "التاريخ".\n- الحالات ليست (غائب/غياب بعذر).`);
      }
      
    }catch(err){
      console.error(`خطأ ${i+1}:`,err);
      alert(`❌ خطأ في الجدول ${i+1}: ${err.message}`);
    }
  }
  
  if(totalImported===0){
    return alert(`❌ لم يتم استيراد أي سجل من جميع الجداول.\n\nتأكد من:\n1. أن الروابط تعمل (افتحها في المتصفح).\n2. أن الأعمدة تحتوي على كلمة "التاريخ".\n3. أن الحالات مكتوبة (غائب / غياب بعذر).`);
  }
  
  if(allNewStudents.length>0){
    if(confirm(`تم العثور على ${allNewStudents.length} طالب جديد غير موجودين في النظام.\n\nهل تريد إضافتهم إلى قاعدة البيانات الآن؟`)){
      D.students=[...D.students,...allNewStudents];
      totalCreated=allNewStudents.length;
    }
  }
  
  toast(`⏳ جارٍ حفظ ${totalImported} سجل...`);
  try{
    const batch=F.writeBatch(db);
    const dates=Object.keys(allData);
    for(const date of dates){
      batch.set(dc('att/'+date),{m:allData[date],by:{_imported:ME.name||'استيراد'}},{merge:true});
    }
    await batch.commit();
    
    if(totalCreated>0) save();
    
    logAction('استيراد من Google Sheets',`${totalImported} سجل + ${totalCreated} طالب جديد`);
    alert(`✅ تمت العملية بنجاح!\n\n- السجلات المستوردة: ${totalImported}\n- الطلاب المضافون: ${totalCreated}`);
    
    setTimeout(()=>location.reload(),1500);
  }catch(err){
    console.error('فشل الحفظ:',err);
    alert('❌ فشل حفظ البيانات: '+err.message);
  }
}

function processSheetData(rows,allData,allNewStudents){
  const result={imported:0};
  
  let headerRowIdx=-1,headers=[];
  for(let i=0;i<Math.min(10,rows.length);i++){
    const row=rows[i].map(c=>String(c||'').trim());
    if(row.some(c=>/التاريخ|تاريخ/i.test(c))){headerRowIdx=i;headers=row;break;}
  }
  
  if(headerRowIdx===-1){
    console.warn('لا يوجد عمود تاريخ');
    return result;
  }
  
  const dateIdx=headers.findIndex(h=>/التاريخ|تاريخ/i.test(h));
  const dayIdx=headers.findIndex(h=>/اليوم|يوم/i.test(h));
  
  const studentCols=[];
  headers.forEach((h,i)=>{
    if(i===dateIdx||i===dayIdx)return;
    if(!h||h.length<3)return;
    studentCols.push({index:i,name:h});
  });
  
  console.log('عدد الطلاب في الجدول:', studentCols.length);
  
  const dataRows=rows.slice(headerRowIdx+1);
  
  const existingStudentsMap = new Map();
  D.students.forEach(s => existingStudentsMap.set(s.name.trim(), s));
  allNewStudents.forEach(s => existingStudentsMap.set(s.name.trim(), s));
  
  dataRows.forEach(row=>{
    const dateStr=String(row[dateIdx]||'').trim();
    if(!dateStr)return;
    
    const normalizedDate=normalizeDate(dateStr);
    if(!normalizedDate)return;
    
    studentCols.forEach(col=>{
      const statusStr=String(row[col.index]||'').trim();
      if(!statusStr)return;
      
      const status=parseStatus(statusStr);
      if(!status)return;
      
      let student = existingStudentsMap.get(col.name.trim());
      
      if(!student){
        student = {
          id: 'x' + Math.random().toString(36).slice(2,9),
          name: col.name.trim(),
          grade: 'غير محدد',
          cls: 'غير محدد',
          num: '',
          phone: ''
        };
        allNewStudents.push(student);
        existingStudentsMap.set(student.name, student);
      }
      
      if(!allData[normalizedDate])allData[normalizedDate]={};
      allData[normalizedDate][student.id]=status;
      result.imported++;
    });
  });
  
  return result;
}

function parseStatus(statusStr){
  if(!statusStr)return null;
  const s=String(statusStr).trim();
  if(/بعذر|مقبول|excused|عذر/i.test(s))return 'e';
  if(/متأخر|تأخير|late/i.test(s))return 'l';
  if(/غائب|غياب|^غ$/i.test(s))return 'a';
  if(/حاضر|present|^ح$/i.test(s))return null;
  return null;
}

function normalizeDate(dateStr){
  if(!dateStr)return null;
  const str=String(dateStr).trim();
  let match=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(match)return `${match[1]}-${match[2].padStart(2,'0')}-${match[3].padStart(2,'0')}`;
  match=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(match){
    let [_,a,b,y]=match;let d=+a,m=+b;
    if(m>12){[d,m]=[m,d];}
    return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  try{const d=new Date(str);if(!isNaN(d.getTime())&&d.getFullYear()>2000&&d.getFullYear()<2100)return iso(d);}catch(e){}
  return null;
}

function parseCSV(text){
  const rows=[];let currentRow=[];let currentCell='';let inQuotes=false;
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  for(let i=0;i<text.length;i++){
    const char=text[i];const nextChar=text[i+1];
    if(char==='"'){if(inQuotes&&nextChar==='"'){currentCell+='"';i++;}else{inQuotes=!inQuotes;}}
    else if(char===','&&!inQuotes){currentRow.push(currentCell);currentCell='';}
    else if((char==='\n'||char==='\r')&&!inQuotes){
      if(char==='\r'&&nextChar==='\n')i++;
      if(currentCell||currentRow.length){currentRow.push(currentCell);if(currentRow.some(c=>c.trim()))rows.push(currentRow);currentRow=[];currentCell='';}
    }else{currentCell+=char;}
  }
  if(currentCell||currentRow.length){currentRow.push(currentCell);if(currentRow.some(c=>c.trim()))rows.push(currentRow);}
  return rows;
}
